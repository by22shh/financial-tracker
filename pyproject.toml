[project]
name = "fintracker"
version = "0.2.0"
description = "Расходы из Telegram прямо в Google Sheets"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram>=3.15,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<0.29",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<0.16",
    "mypy>=1.13,<2",
]

[project.scripts]
fintracker = "fintracker.runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src", "integrations", "tests/sheetbot", "README.md", "pyproject.toml", "uv.lock", "Makefile", "Dockerfile", "docker-compose.yml", ".env.example"]

[tool.hatch.build.targets.wheel]
packages = ["src/fintracker"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["RUF001", "RUF002", "RUF003", "S101", "B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N806"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests/sheetbot"]
norecursedirs = [ ".*", "build", "dist", "venv", "node_modules"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:fintracker.*"]
