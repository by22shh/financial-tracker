# Стек и версии зафиксированы ADR-02; воспроизводимость — uv.lock (OPEN-03).
[project]
name = "fintracker"
version = "0.1.0"
description = "Финансовый трекер в Telegram: личные и совместные бюджеты"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram>=3.15,<4",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.14,<2",
    "httpx>=0.27,<0.29",
    "openpyxl>=3.1,<4",
    "structlog>=24.4,<26",
    "python-dateutil>=2.9,<3",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6.0,<8",
    "hypothesis>=6.115,<7",
    "ruff>=0.8,<0.16",
    "mypy>=1.13,<2",
    "types-python-dateutil",
    "asgi-lifespan>=2.1,<3",
]

[project.scripts]
fintracker = "fintracker.runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fintracker"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.format]
# Диагностики аудита сохраняются в исходном виде: форматирование изменило бы
# файлы, сверяемые с материалами внешней проверки.
exclude = ["tests/readiness/test_flow_readiness.py", "tests/readiness/test_money_readiness.py", "tests/readiness/test_contract_readiness.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["RUF001", "RUF002", "RUF003", "S101", "B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N806"]
"src/fintracker/db/migrations/**" = ["E501", "N999"]
# Диагностики внешнего аудита перенесены в набор как есть: проверяемые
# утверждения важнее стиля, а переписывание изменило бы сам сценарий.
"tests/readiness/test_flow_readiness.py" = ["S", "N806", "E501", "E701", "E702", "RUF043"]
"tests/readiness/test_money_readiness.py" = ["S", "N806", "E501", "E701", "E702", "RUF043"]
"tests/readiness/test_contract_readiness.py" = ["S", "N806", "E501", "E701", "E702", "RUF043"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "pg: тест требует настоящей PostgreSQL 17",
    "slow: длительная проверка",
    "live_ai: требует реального ключа OpenAI",
    "live_telegram: требует реального токена Telegram",
]
filterwarnings = ["error::DeprecationWarning:fintracker.*"]
