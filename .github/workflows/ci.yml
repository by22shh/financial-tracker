# Проверки выпуска: миграции, обратимость, типы и тесты (ADR-15, OPS-01, OPS-04, OPS-05).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Проверки транзакций, SKIP LOCKED, RLS и exclusion constraints
        # выполняются на настоящей PostgreSQL 17 (ADR-15, раздел 8 инструкции).
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: fintracker_owner
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: fintracker
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U fintracker_owner -d fintracker"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Установить зависимости из lockfile
        run: uv sync --frozen --extra dev

      - name: Создать runtime роли без BYPASSRLS
        env:
          PGPASSWORD: devpassword
        run: |
          psql -h localhost -p 55432 -U fintracker_owner -d fintracker -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE fintracker_api LOGIN PASSWORD 'devpassword'
            NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE fintracker_worker LOGIN PASSWORD 'devpassword'
            NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE;
          GRANT CONNECT ON DATABASE fintracker TO fintracker_api, fintracker_worker;
          GRANT USAGE ON SCHEMA public TO fintracker_api, fintracker_worker;
          SQL

      - name: Форматирование
        run: uv run ruff format --check src tests

      - name: Линтер
        run: uv run ruff check src tests

      - name: Типизация
        run: uv run mypy src/fintracker

      - name: Миграции на чистой схеме
        env:
          FINTRACKER_DB__OWNER_DSN: postgresql+psycopg://fintracker_owner:devpassword@localhost:55432/fintracker
        run: uv run alembic upgrade head

      - name: Обратимость миграций
        env:
          FINTRACKER_DB__OWNER_DSN: postgresql+psycopg://fintracker_owner:devpassword@localhost:55432/fintracker
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: Проверки и доказательства прогона
        env:
          FINTRACKER_TEST_PG_HOST: localhost
          FINTRACKER_TEST_PG_PORT: "55432"
          FINTRACKER_TEST_PG_PASSWORD: devpassword
        # Доказательства собирает тот же скрипт, что и локально: отчёт, JUnit и
        # manifest исходников относятся к этому прогону, а не к прежнему (G-29).
        run: uv run python .planning/tools/collect_evidence.py

      - name: Прослеживаемость требований
        # Проверяется свежий отчёт: узлы, их исход и совпадение исходников.
        run: uv run python .planning/tools/check_traceability.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: .planning/evidence/
