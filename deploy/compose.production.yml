name: fintracker

x-app: &app
  image: ${FINTRACKER_IMAGE:-fintracker:4796dc8-deploy}
  restart: unless-stopped
  init: true
  env_file: ../env/runtime.env
  environment:
    FINTRACKER_STORAGE__ROOT: /var/lib/fintracker/objects
    FINTRACKER_SECURITY_LOG__ROOT: /var/lib/fintracker/security-log
  volumes:
    - objects:/var/lib/fintracker/objects
    - securitylog:/var/lib/fintracker/security-log
  depends_on:
    postgres:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  healthcheck:
    test: [CMD, fintracker, check]
    interval: 60s
    timeout: 45s
    start_period: 60s
    start_interval: 30s
    retries: 3
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    restart: unless-stopped
    env_file: ../env/database.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    # PostgreSQL is reachable only on the private Compose network.
    command: [postgres, -c, max_connections=50, -c, shared_buffers=128MB]
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fintracker_owner -d fintracker"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *app
    build: ../source
    profiles: [ops]
    restart: "no"
    entrypoint: [python, /deploy/migrate.py]
    env_file:
      - ../env/runtime.env
      - ../env/migration.env
    environment:
      FINTRACKER_ENV: dev
    volumes:
      - ./migrate.py:/deploy/migrate.py:ro
    healthcheck:
      disable: true

  api:
    <<: *app
    profiles: [app]
    command: [api, --port, "8080"]
    ports: ["127.0.0.1:18080:8080"]
    mem_limit: 256m

  worker:
    <<: *app
    profiles: [app]
    command: [worker]
    mem_limit: 384m

  scheduler:
    <<: *app
    profiles: [app]
    command: [scheduler]
    mem_limit: 192m

  polling:
    <<: *app
    profiles: [polling]
    command: [poll]
    mem_limit: 192m

volumes:
  pgdata:
  objects:
  securitylog:
